
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas at Bluewater</title>
<style>

/* Bluewater Christmas Animations */

.village::before {
 content: "";
  position: absolute;
  left: 60.9%;
  top: 26%;
  width: 4%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    #fff9cf 0%,
    rgba(255, 220, 130, .5) 35%,
    transparent 70%
  );
  transform: translate(-50%, -50%);
  animation: lighthouseSweep 5s ease-in-out infinite;
  pointer-events: none;
  z-index: 1;
}

@keyframes lighthouseSweep {
  0%, 100% { opacity: .15; }
  50% { opacity: .95; }
}

.village::after {
  content: "";
  position: absolute;
  left: 54.5%;
  top: 60%;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #fff9cf;
  box-shadow:
    0 0 10px 4px #ffe8a0,
    -18px 25px 9px 3px #fff3b0,
    20px 35px 9px 3px #fff3b0,
    -35px 60px 9px 3px #ffe8a0,
    30px 75px 9px 3px #fff3b0,
    -12px 95px 9px 3px #ffe8a0;
  animation: treeTwinkle 3s ease-in-out infinite;
  pointer-events: none;
  z-index: 1;
}

@keyframes treeTwinkle {
  0%, 100% { opacity: .2; }
  50% { opacity: .9; }
}

@media (prefers-reduced-motion: reduce) {
  .village::before,
  .village::after {
    display: none;
  }
}

  * { box-sizing: border-box; }
body {
  margin: 0;
  background: #102b46;
  color: #fff8e9;
  font-family: Georgia, serif;
  text-align: center;
}
main {
  max-width: 1400px;
  margin: auto;
  padding: 12px;
}
.village {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
}
.village img {
  width: 100%;
  display: block;
}
.door {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 8%;
  height: 13%;
  background: transparent;
  border: 2px solid transparent;
  border-radius: 12px;
  cursor: pointer;
  z-index: 2;
  touch-action: manipulation;
}
.door:hover, .door:focus-visible {
  background: #ffe9a333;
  border-color: #fff0b0;
  box-shadow: 0 0 20px #ffda80;
}
.snow {
  position: absolute;
  top: -15px;
  color: white;
  pointer-events: none;
  animation: fall linear infinite;
  opacity: .7;
}
@keyframes fall {
  to { transform: translate(25px, 85vw); }
}
dialog {
  width: min(90%, 440px);
  background: #fffaf0;
  color: #173a53;
  border: 2px solid #c9a76b;
  border-radius: 18px;
  padding: 28px;
  box-shadow: 0 8px 40px #0005;
}
dialog::backdrop {
  background: #081c30aa;
}
.close {
  background: #173a53;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 12px 24px;
  cursor: pointer;
}
.day-list {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin: 18px auto;
}
.day-list button {
  background: #fff8e9;
  color: #173a53;
  border: 1px solid #c9a76b;
  border-radius: 8px;
  min-width: 44px;
  min-height: 44px;
  cursor: pointer;
}
footer {
  font-size: 14px;
  padding: 15px;
}
@media (prefers-reduced-motion: reduce) {
  .snow { display: none; }
}/* Mobile calendar layout */

@media (max-width: 700px) {
  .day-list {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 8px;
    max-width: 420px;
    padding: 0 4px;
  }

  .day-list button {
    width: 100%;
    min-width: 0;
    min-height: 44px;
    font-size: 16px;
  }

  main {
    padding: 8px;
  }
}
</style>
</head>
<body>
<main>
  <p id="countdown"></p>
  <div class="village" id="village">
    <img id="art"
      src="christmas-%20village.png"
      alt="Christmas at Bluewater Advent Calendar">
  </div>
  <p>Choose a numbered door to discover a little Christmas joy.</p>
  <div class="day-list" id="dayList"></div>
  <footer>
    A Christmas gift from Amber &amp; Ash
    <p>Made with love at Bluewater.</p>
  </footer>
</main>

<dialog id="gift">
  <h2 id="giftTitle"></h2>
  <p id="giftText"></p>
  <button class="close"
    onclick="document.getElementById('gift').close()">
    Close
  </button>
</dialog>

<script>
const preview = new URLSearchParams(
  location.search
).get("preview") === "1";

const art = document.getElementById("art");
art.onerror = function() {
  art.onerror = null;
  art.src = "christmas-village.png";
};

const doors = [
  [7.6, 62],
  [18.2, 62],
  [12.6, 29],
  [30.5, 34],
  [42.3, 36],
  [88.1, 28],
  [33.1, 59],
  [42.9, 59],
  [74.8, 57],
  [93.3, 57],
  [74.8, 73],
  [92.2, 73]
];

const gifts = [
  "Welcome to Christmas at Bluewater",
  "A Little Christmas Inspiration",
  "Christmas Word Puzzle",
  "A Winter Story",
  "Meanwhile at Bluewater",
  "Winter Phone Wallpaper",
  "A Christmas Memory",
  "Christmas Trivia",
  "A Winter Solstice Reflection",
  "A Surprise from Piper",
  "Christmas Bookmark",
  "A Christmas Eve Letter"
];

const village = document.getElementById("village");
const dayList = document.getElementById("dayList");

function openDate(day) {
  return new Date(2026, 11, 12 + day);
}

function openDoor(day) {
  const date = openDate(day);
  const unlocked = preview || new Date() >= date;

  document.getElementById("giftTitle").textContent =
    unlocked ? gifts[day - 1] : "A little more waiting!";

  document.getElementById("giftText").textContent =
    unlocked
    ? "Your special Christmas surprise for Day " +
      day + " will appear here."
    : "This little surprise opens December " +
      (12 + day) + ". Come back then!";

 
  const giftText = document.getElementById("giftText");

  if (unlocked && day === 1) {
    giftText.innerHTML = `
      <img src="day-01.png"
        alt="Piper and the bluebird welcome you"
        style="width:100%; border-radius:10px;">

      <div style="text-align:left; line-height:1.6;">

        <p>This year, I wanted to do something a little special for the holidays. Something that didn't require a shopping list, wrapping paper, or another trip to the store.</p>

        <p>So, I created a little Christmas village just for you.</p>

        <p>Over the next 12 days, a new door will open, revealing a small surprise. Some will make you smile, others might make you reflect, and a few are little gifts you can keep.</p>

        <p>My hope is that you'll find a few minutes in the busyness of the season to pause and enjoy yourself.</p>

        <p>As Ferris Bueller once said:</p>

        <p style="font-style:italic; text-align:center;">
        “Life moves pretty fast. If you don't stop and look around once in a while, you could miss it.”
        </p>

        <p>Piper, the little bluebird, and I are glad you're here.</p>

        <p>Merry Christmas,<br>
        Bonnie Bluewater</p>

      </div>
    `;
  }
  if (unlocked && day === 2) {
    giftText.innerHTML = `
      <img src="day-02.png"
        alt="Not every little joy needs to be wrapped"
        style="width:100%; border-radius:10px;">

      <div style="text-align:left; line-height:1.6;">

        <p>Every so often, the best gifts of the Christmas season are the moments we didn't plan for.</p>

        <p>Today's little joy is yours to keep. Save it to your phone or share it with someone who could use a little Christmas cheer.</p>

      </div>

      <a href="day-02.png" download="Bluewater-Christmas-Card.png"
        style="display:inline-block; background:#15364d; color:white; padding:12px 18px; border-radius:8px; text-decoration:none; margin:10px 0;">
        Save Your Christmas Card
      </a>
    `;
  }

  if (unlocked && day === 3) {
    giftText.innerHTML = `
      <iframe src="day-03.html"
        title="The Bluewater Christmas Word Hunt"
        style="width:100%; height:780px; border:0; border-radius:10px;">
      </iframe>
    `;
  }

  if (unlocked && day === 4) {
    document.getElementById("giftTitle").textContent =
      "The Last Light in the Bookshop";

    giftText.innerHTML = `
      <img src="day-04.png"
        alt="A snowy Christmas evening at the Amber and Ash Bookshop"
        style="width:100%; border-radius:10px;">

      <div style="text-align:left; line-height:1.6;">

        <p>Snow had been falling since four, and by seven, the little village of Bluewater had settled in for the night.</p>

        <p>Inside the Amber &amp; Ash Bookshop, Eileen was turning off the lamps when she noticed a young boy standing outside the window. His red mittens were pressed against the glass.</p>

        <p>She opened the door.</p>

        <p>“Looking for something?”</p>

        <p>The boy reached into his coat pocket and pulled out a handful of coins.</p>

        <p>“A book for my mom. She used to read all the time, but she doesn't much anymore.”</p>

        <p>Eileen invited him inside. Piper lifted her head from beneath the counter. Closing time, it seemed, was negotiable.</p>

        <p>Together, they wandered through the shelves until the boy stopped in front of a little blue book with gold lettering.</p>

        <p>“That one,” he said.</p>

        <p>He counted his coins on the counter. Two dollars and seventeen cents.</p>

        <p>Eileen glanced at the price and then back at the boy.</p>

        <p>“Well, would you look at that. That's exactly what we're charging for this book tonight.”</p>

        <p>She wrapped it in brown paper and tied it with a silver and blue ribbon.</p>

        <p>“Would you like to write something inside?”</p>

        <p>He thought for a moment before carefully writing:</p>

        <p style="font-style:italic; text-align:center;">
        For Mom. So you can go everywhere without having to go anywhere.
        </p>

        <p>After he left, Eileen stood by the window, watching his little footprints disappear beneath the falling snow.</p>

        <p>She had spent most of December worrying about sales, inventory and whether keeping a small bookshop open was still worth the trouble.</p>

        <p>Funny how two dollars and seventeen cents could answer a question she'd been asking herself all year.</p>

        <p>She turned off the last lamp, leaving only the Christmas lights glowing in the window.</p>

        <p>Somehow, the shop didn't feel quite so dark.</p>

        <p style="text-align:center; font-style:italic; margin-top:30px;">
        An original Christmas story by Bonnie Bluewater
        </p>

      </div>
    `;
  }

  if (unlocked && day === 5) {
    document.getElementById("giftTitle").textContent =
      "The Bluewater Café's Christmas Hot Chocolate";

    giftText.innerHTML = `
      <p>Two mugs. A little warmth. A moment to share.</p>

      <img src="day-05.png"
        alt="Bluewater Café Christmas Hot Chocolate Recipe"
        style="width:100%; border-radius:10px;">

      <p>Save this little Christmas recipe to enjoy whenever you need a warm moment.</p>

      <a href="day-05.png"
        download="Bluewater-Christmas-Hot-Chocolate.png"
        style="display:inline-block;
        background:#18354a;
        color:#ffffff;
        padding:12px 22px;
        border-radius:8px;
        text-decoration:none;
        margin:12px 0;">
        Save Recipe Card
      </a>
    `;
  }  if (unlocked && day === 6) {
    document.getElementById("giftTitle").textContent =
      "A Letter to Next Christmas";

    giftText.innerHTML = `
      <iframe
        src="day-06.html"
        title="Bluewater Christmas Post Office"
        style="width:100%;
        height:850px;
        border:none;
        border-radius:10px;">
      </iframe>
    `;
  }  if (unlocked && day === 7) {
    document.getElementById("giftTitle").textContent =
      "Name That Christmas Movie";

    giftText.innerHTML = `
      <iframe
        src="day-07.html"
        title="The Bluewater Christmas Cinema"
        style="width:100%;
        height:720px;
        border:none;
        border-radius:10px;">
      </iframe>
    `;
  }if (unlocked && day === 8) {
  document.getElementById("giftTitle").textContent =
    "The Bluewater Christmas Music Shop";

  giftText.innerHTML = `
    <iframe
      id="musicShop"
      src="day-08.html"
      title="Bluewater Christmas Music Shop"
      style="width:100%;
      height:620px;
      border:none;
      border-radius:10px;">
    </iframe>
  `;
}if (unlocked && day === 9) {
  document.getElementById("giftTitle").textContent =
    "The Bluewater Christmas Ornament Shop";

  giftText.innerHTML = `
    <iframe
      src="day-09.html"
      title="Bluewater Christmas Ornament Shop"
      style="width:100%;
      height:1100px;
      border:none;
      border-radius:10px;">
    </iframe>
  `;
}
 if (unlocked && day === 10) {
  giftText.innerHTML = `
    <iframe
      id="snowGlobe"
      src="day-10.html"
      title="The Bluewater Christmas Snow Globe"
      style="width:100%; height:850px; border:0; border-radius:12px;"
      loading="lazy">
    </iframe>
  `;
}
 if (unlocked && day === 11) {
  giftText.innerHTML = `
    <iframe
      id="christmasPostOffice"
      src="day-11.html"
      title="The Bluewater Christmas Post Office"
      style="width:100%; height:1200px; border:0; border-radius:12px;"
      loading="lazy">
    </iframe>
  `;
}
 if (unlocked && day === 12) {
  giftText.innerHTML = `
    <iframe
      id="christmasFinale"
      src="day-12.html"
      title="The Bluewater Christmas Finale"
      style="width:100%; height:1400px; border:0; border-radius:12px;"
      loading="lazy">
    </iframe>
  `;
}
  document.getElementById("gift").style.maxHeight = "85dvh";
  document.getElementById("gift").style.overflowY = "auto";


  document.getElementById("gift").showModal();
requestAnimationFrame(() => {
  document.getElementById("gift").scrollTop = 0;
});}

doors.forEach(([x, y], i) => {
  const day = i + 1;
  const button = document.createElement("button");
  button.className = "door";
  button.style.left = x + "%";
  button.style.top = y + "%";
  button.setAttribute("aria-label", "Open door " + day);
  button.onclick = () => openDoor(day);
  village.appendChild(button);

  const shortcut = document.createElement("button");
  shortcut.textContent = day;
  shortcut.setAttribute("aria-label", "Open day " + day);
  shortcut.onclick = () => openDoor(day);
  dayList.appendChild(shortcut);
});

for (let i = 0; i < 35; i++) {
  const flake = document.createElement("span");
  flake.className = "snow";
  flake.textContent = "❄";
  flake.style.left = Math.random() * 100 + "%";
  flake.style.fontSize = (5 + Math.random() * 9) + "px";
  flake.style.animationDuration =
    (9 + Math.random() * 12) + "s";
  flake.style.animationDelay =
    (-Math.random() * 20) + "s";
  village.appendChild(flake);
}

function updateCountdown() {
  const now = new Date();
  const remaining = Math.max(0,
    Math.ceil((openDate(1) - now) / 86400000));

  document.getElementById("countdown").textContent =
    preview ? "Christmas at Bluewater • Preview Mode"
    : remaining > 0
    ? remaining + " days until our first door opens!"
    : "Welcome to Christmas at Bluewater!";
}
updateCountdown();
setInterval(updateCountdown, 60000);
 document.getElementById("gift").addEventListener("close", () => {
  const musicShop = document.getElementById("musicShop");

  if (musicShop && musicShop.contentWindow) {
    musicShop.contentWindow.postMessage(
      "stopBluewaterMusic",
      window.location.origin
    );
  }
  const snowGlobe = document.getElementById("snowGlobe");

  if (snowGlobe && snowGlobe.contentWindow) {
    snowGlobe.contentWindow.postMessage(
      "stopBluewaterGlobe",
      window.location.origin
    );
  }
  const christmasFinale =
  document.getElementById("christmasFinale");

if (christmasFinale && christmasFinale.contentWindow) {
  christmasFinale.contentWindow.postMessage(
    "stopBluewaterFinale",
    window.location.origin
  );
}
 });
</script>
</body>
</html>
