
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>The Bluewater Christmas Snow Globe</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 8px;
  background: #faf8f2;
  color: #18354a;
  font-family: Georgia, serif;
  text-align: center;
}

.globe-shop {
  max-width: 650px;
  margin: auto;
}

.artwork {
  position: relative;
  width: 100%;
  overflow: hidden;
  border-radius: 12px;
  cursor: pointer;
  touch-action: manipulation;
}

.artwork img {
  display: block;
  width: 100%;
  height: auto;
}

#snow {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  clip-path: ellipse(33% 29% at 50% 30%);
}

.beam {
  position: absolute;
  left: 44%;
  top: 17.2%;
  width: 30%;
  height: 11%;
  background: linear-gradient(
    90deg,
    rgba(255,239,170,0.65),
    rgba(255,239,170,0)
  );
  clip-path: polygon(0 45%, 100% 0, 100% 100%);
  transform-origin: 0 45%;
  pointer-events: none;
  opacity: 0;
  mix-blend-mode: screen;
}

.artwork.playing .beam {
  animation: lighthouse 6s ease-in-out infinite;
}

@keyframes lighthouse {
  0%, 100% {
    transform: scaleX(0.35);
    opacity: 0.15;
  }

  50% {
    transform: scaleX(1);
    opacity: 0.85;
  }
}

.instructions {
  font-size: 16px;
  line-height: 1.6;
  margin: 16px 0;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 12px auto;
}

button {
  padding: 13px 18px;
  border: 1px solid #c5ad78;
  border-radius: 8px;
  background: #18354a;
  color: white;
  font-size: 15px;
  cursor: pointer;
  min-height: 46px;
}

#soundButton {
  background: #faf8f2;
  color: #18354a;
}

#soundButton[aria-pressed="true"] {
  background: #356d62;
  color: white;
}

#status {
  min-height: 24px;
  color: #527f9e;
  font-size: 14px;
  font-style: italic;
  margin: 18px 0;
}

.signature {
  font-style: italic;
  color: #527f9e;
  margin: 20px 0;
}

@media (max-width: 600px) {
  body {
    padding: 4px;
  }

  button {
    flex: 1;
  }
}

@media (prefers-reduced-motion: reduce) {
  .artwork.playing .beam {
    animation: none;
    opacity: 0.25;
  }
}

</style>
</head>

<body>

<main class="globe-shop">

<div class="artwork"
     id="globe"
     role="button"
     tabindex="0"
     aria-label="Shake the Christmas snow globe">

  <img src="day-10.png"
       alt="A Christmas snow globe with the Bluewater lighthouse, a snowy cottage and Piper">

  <div class="beam"></div>

  <canvas id="snow"
          width="1000"
          height="1000"
          aria-hidden="true">
  </canvas>

</div>

<p class="instructions">
Tap the globe to stir up a little Christmas magic.
</p>

<div class="buttons">

<button id="shakeButton">
  Shake the Globe
</button>

<button id="soundButton"
        aria-pressed="false">
  Winter Wind: Off
</button>

</div>

<p id="status" aria-live="polite">
A quiet little corner of Christmas.
</p>

<p class="signature">Bluewater</p>

</main>

<script>

const globe = document.getElementById("globe");
const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");
const soundButton = document.getElementById("soundButton");

let flakes = [];
let snowUntil = 0;
let animationFrame = null;
let previousTime = 0;

let audioContext;
let windSource;
let windGain;
let soundOn = false;
let soundVersion = 0;

const reducedMotion = window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

function createFlake() {

  return {
    x: 170 + Math.random() * 660,
    y: 30 + Math.random() * 540,
    radius: 1.5 + Math.random() * 3.5,
    speed: 0.6 + Math.random() * 1.8,
    drift: Math.random() * 2 - 1,
    opacity: 0.4 + Math.random() * 0.6,
    phase: Math.random() * Math.PI * 2
  };

}

function shakeGlobe() {

  const count = reducedMotion ? 30 : 180;

  flakes = Array.from(
    { length: count },
    createFlake
  );

  snowUntil = performance.now() + 18000;

  globe.classList.add("playing");

  status.textContent =
    "A little Christmas magic is falling...";

  if (animationFrame === null) {
    previousTime = performance.now();
    animationFrame = requestAnimationFrame(drawSnow);
  }

}

function drawSnow(now) {

  const step = Math.min(
    (now - previousTime) / 16.67,
    2
  );

  previousTime = now;

  ctx.clearRect(0, 0, 1000, 1000);

  const remaining = snowUntil - now;

  const fade = Math.max(
    0,
    Math.min(1, remaining / 6000)
  );

  flakes.forEach(flake => {

    flake.y += flake.speed * step;

    flake.x += (
      flake.drift +
      Math.sin(now / 900 + flake.phase) * 0.7
    ) * step;

    if (flake.y > 600) {
      flake.y = 15;
      flake.x = 170 + Math.random() * 660;
    }

    ctx.beginPath();

    ctx.arc(
      flake.x,
      flake.y,
      flake.radius,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "rgba(255,255,255," +
      flake.opacity * fade +
      ")";

    ctx.fill();

  });

  if (remaining > 0) {

    animationFrame =
      requestAnimationFrame(drawSnow);

  } else {

    ctx.clearRect(0, 0, 1000, 1000);

    animationFrame = null;

    globe.classList.remove("playing");

    status.textContent =
      "The snow has settled. Shake again whenever you wish.";

  }

}

async function startWind() {

  const version = ++soundVersion;

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) {
      throw new Error("Audio unavailable");
    }

    if (!audioContext) {
      audioContext = new AudioContext();
    }

    await audioContext.resume();

    if (version !== soundVersion) return;

    const length = audioContext.sampleRate * 4;

    const buffer = audioContext.createBuffer(
      1,
      length,
      audioContext.sampleRate
    );

    const data = buffer.getChannelData(0);

    let last = 0;

    for (let i = 0; i < length; i++) {

      const white = Math.random() * 2 - 1;

      last = (last + 0.02 * white) / 1.02;

      data[i] = last * 3.5;

    }

    windSource = audioContext.createBufferSource();

    windSource.buffer = buffer;
    windSource.loop = true;

    const filter = audioContext.createBiquadFilter();

    filter.type = "lowpass";
    filter.frequency.value = 500;

    windGain = audioContext.createGain();

    windGain.gain.value = 0;

    windSource.connect(filter);
    filter.connect(windGain);
    windGain.connect(audioContext.destination);

    windSource.start();

    windGain.gain.linearRampToValueAtTime(
      0.12,
      audioContext.currentTime + 2
    );

    soundOn = true;

    soundButton.textContent = "Winter Wind: On";

    soundButton.setAttribute(
      "aria-pressed",
      "true"
    );

  } catch (error) {

    status.textContent =
      "Winter wind is unavailable on this device.";

  }

}

function stopWind() {

  soundVersion++;

  if (windSource) {

    try {
      windSource.stop();
      windSource.disconnect();
    } catch (error) {}

    windSource = null;

  }

  soundOn = false;

  soundButton.textContent = "Winter Wind: Off";

  soundButton.setAttribute(
    "aria-pressed",
    "false"
  );

}

globe.addEventListener("click", shakeGlobe);

globe.addEventListener("keydown", event => {

  if (event.key === "Enter" || event.key === " ") {

    event.preventDefault();
    shakeGlobe();

  }

});

document.getElementById("shakeButton")
  .addEventListener("click", shakeGlobe);

soundButton.addEventListener("click", () => {

  if (soundOn) {
    stopWind();
  } else {
    startWind();
  }

});

window.addEventListener("message", event => {

  if (
    event.origin === window.location.origin &&
    event.data === "stopBluewaterGlobe"
  ) {

    stopWind();

    snowUntil = 0;

  }

});

window.addEventListener("pagehide", stopWind);

document.addEventListener("visibilitychange", () => {

  if (document.hidden) {
    stopWind();
  }

});

</script>

</body>
</html>
